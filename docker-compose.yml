version: "3.8"

services:
  mongo:
    image: mongo:7.0
    container_name: uptoskills-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: uptoskills
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - uptoskills-network

  server:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: uptoskills-server
    restart: always
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/uptoskills
      CLIENT_ORIGIN: http://localhost:5173,http://localhost:80,http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-uptoskills_super_secret_jwt_key_at_least_32_chars_prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-uptoskills_super_secret_refresh_jwt_key_at_least_32_chars}
      ADMIN_ACCESS_CODE: ${ADMIN_ACCESS_CODE:-UPTO_ADMIN_DEV_2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      TTS_PROVIDER: ${TTS_PROVIDER:-google}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - uptoskills-network

  client:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5001/api
    container_name: uptoskills-client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - uptoskills-network

volumes:
  mongo_data:

networks:
  uptoskills-network:
    driver: bridge
