name: UptoSkills LMS CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Client & Root Dependencies
        run: npm ci

      - name: Install Server Dependencies
        run: cd Backend && npm ci

      - name: Verify ESLint Quality Gate
        run: npm run lint

      - name: Run Client Vitest & RTL Component Tests
        run: npm run test:client

      - name: Run Server Supertest Integration Tests
        run: npm run test:server
        env:
          NODE_ENV: test
          JWT_SECRET: ci-testing-jwt-secret-key-32chars
          ADMIN_ACCESS_CODE: UPTO_ADMIN_DEV_2026

      - name: Build Production Frontend Bundle
        run: npm run build
